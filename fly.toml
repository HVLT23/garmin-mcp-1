#   MCP_PORT = "8000"
#   GARMIN_TOKENS_PATH = "/data/tokens"
#
# [[mounts]]
#   source = "garmin_tokens"
#   destination = "/data/tokens"
#
# [http_service]
#   internal_port = 8000
#   force_https = true
#   auto_stop_machines = true
#   auto_start_machines = true
