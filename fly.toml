# fly.toml — Fly.io deployment for garmin-mcp.
#
# Multi-tenant deployment. Default region is Frankfurt (`fra`) — a major
# EU hub with low latency from most of Europe. Change `primary_region`
# to anything closer to you. The app name below is a placeholder —
# `fly launch` will rewrite it (or override with `fly launch --name <yours>`).
#
# Authentication: per-user bearers live in `/data/registry.json`. Provision
# tenants with `garmin-mcp admin provision --user-id <name>` over `fly ssh`.
# `MCP_BEARER_TOKEN` is only honoured during the legacy migration window
# (registry empty); once the registry is populated it can be removed.
#
# Tokens layout on the volume:
#   /data/tokens/<user_id>/garmin_tokens.json  — per-user OAuth tokens
#   /data/registry.json                         — sha256(bearer) → user_id
#
# See README "Multi-tenant deployment" for the full migration recipe.

app = "garmin-mcp"
primary_region = "fra"

[build]
  # Builds the Dockerfile at the repo root (default builder).

[env]
  MCP_TRANSPORT = "http"
  MCP_HOST = "0.0.0.0"
  MCP_PORT = "8000"
  GARMIN_TOKENS_PATH = "/data/tokens"
  GARMIN_REGISTRY_PATH = "/data/registry.json"

[[mounts]]
  source = "garmin_tokens"
  destination = "/data/tokens"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on. The app holds a long-lived Garmin session and a process-local
  # cache; cold starts would discard both and add a multi-second SSO step
  # to the first request after each idle window.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
