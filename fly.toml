# fly.toml — placeholder. Deployment is a follow-up phase.
#
# When ready, fill out app/region/services and run:
#   fly secrets set MCP_BEARER_TOKEN=...
#   fly volumes create garmin_tokens --size 1
#   fly deploy
#
# Reminder: tokens must be bootstrapped locally (`garmin-mcp auth login`)
# and uploaded to the volume — never bake creds into the image.

